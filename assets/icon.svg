<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="도서모음">
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6fffb"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6fffb"/>
    </linearGradient>
  </defs>

  <!-- 민트 배경 -->
  <rect width="512" height="512" rx="104" fill="url(#mint)"/>

  <!-- 펼친 책 (흰색) -->
  <g stroke="#0d9488" stroke-width="5" stroke-linejoin="round">
    <!-- 왼쪽 페이지 -->
    <path d="M256 168 C205 146 150 142 104 156 L104 300 C150 288 205 292 256 312 Z" fill="url(#pageL)"/>
    <!-- 오른쪽 페이지 -->
    <path d="M256 168 C307 146 362 142 408 156 L408 300 C362 288 307 292 256 312 Z" fill="url(#pageR)"/>
  </g>
  <!-- 책등 -->
  <line x1="256" y1="168" x2="256" y2="312" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>
  <!-- 페이지 라인 -->
  <g stroke="#99f6e4" stroke-width="4" stroke-linecap="round">
    <line x1="132" y1="192" x2="228" y2="204"/>
    <line x1="132" y1="222" x2="228" y2="234"/>
    <line x1="284" y1="204" x2="380" y2="192"/>
    <line x1="284" y1="234" x2="380" y2="222"/>
  </g>

  <!-- 한글 제목 -->
  <text x="256" y="400" text-anchor="middle"
        font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="900"
        font-size="72" fill="#0f766e" letter-spacing="2">도서모음</text>
</svg>
