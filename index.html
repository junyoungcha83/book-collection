<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>도서모음</title>
<link rel="stylesheet" href="assets/app.css?v=14" />

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#14b8a6" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="도서모음" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
</head>
<body>

<!-- 홈: 책 그리드 -->
<section id="homeView">
  <header class="app-header">
    <img class="app-logo" src="assets/icon.svg" alt="" />
    <h1>도서모음</h1>
    <span class="app-ver" id="appVer"></span>
    <span class="app-count" id="bookCount"></span>
    <span class="sync-status" id="syncStatus"></span>
    <button class="btn-editmode" type="button" aria-pressed="false" hidden>📝 편집</button>
    <button class="icon-btn" id="btnRefresh" title="새로고침 — 다른 기기에서 고친 내용 받아오기" aria-label="새로고침">🔄</button>
    <button class="icon-btn" id="btnLock" title="동기화 잠금/해제" aria-label="편집 잠금">🔒</button>
  </header>
  <main class="home-main">
    <div class="grid" id="grid"></div>
  </main>
</section>

<!-- 상세: 4개 탭 (목차·내용·원본·메모) -->
<section id="bookView" class="hidden">
  <header class="app-header detail">
    <button class="icon-btn" id="btnBack" aria-label="뒤로">←</button>
    <div class="detail-title">
      <h1 id="dTitle">제목</h1>
      <span id="dAuthor">저자</span>
    </div>
    <button class="btn-editmode" type="button" aria-pressed="false" hidden>📝 편집</button>
    <button class="icon-btn" id="btnEditInfo" title="정보 수정" aria-label="정보 수정">✏️</button>
    <button class="icon-btn" id="btnDelete" title="삭제" aria-label="삭제">🗑</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab active" data-tab="toc" role="tab">목차</button>
    <button class="tab" data-tab="content" role="tab">내용</button>
    <button class="tab" data-tab="original" role="tab">원본</button>
    <button class="tab" data-tab="memo" role="tab">메모</button>
  </nav>
  <main class="detail-main">
    <!-- 목차 -->
    <div class="panel" id="panelToc">
      <div class="edit" id="fToc" data-field="toc" contenteditable="true" data-ph="목차를 입력하세요… (예: 1장 …)"></div>
    </div>
    <!-- 내용 (텍스트 + 본문 삽화/표) -->
    <div class="panel hidden" id="panelContent">
      <div class="edit" id="fContent" data-field="content" contenteditable="true" data-ph="내용을 입력하세요… (커서 위치에 그림·표를 바로 넣을 수 있어요)"></div>
      <div class="img-bar">
        <button class="btn small" id="btnImportDocx">📄 워드(.docx) 불러오기</button>
        <button class="btn small ghost" id="btnAddImg">🖼️ 보관함에 그림 추가</button>
        <input type="file" accept=".docx" id="docxFile" style="display:none" />
        <input type="file" accept="image/*" id="imgFile" multiple style="display:none" />
      </div>
      <p class="img-note hidden" id="imgNote">보관함의 그림은 <b>↥ 본문으로</b>를 누르면 커서가 있던 문단 뒤에 삽화로 들어갑니다.</p>
      <div class="img-grid" id="imgGrid"></div>
    </div>
    <!-- 원본 (텍스트 전용: 그림·표 없이 글만) -->
    <div class="panel hidden" id="panelOriginal">
      <div class="edit plain" id="fOriginal" data-field="original" contenteditable="true" data-ph="책의 원문을 그대로 붙여넣으세요… (글자만 들어갑니다)"></div>
      <div class="img-bar">
        <button class="btn small" id="btnImportTxt">📄 텍스트(.txt) 불러오기</button>
        <input type="file" accept=".txt,text/plain" id="txtFile" style="display:none" />
      </div>
      <p class="img-note">붙여넣기는 <b>서식 없이 글자만</b> 들어갑니다. 그림·표는 <b>내용</b> 탭에서 넣어 주세요.</p>
    </div>
    <!-- 메모 -->
    <div class="panel hidden" id="panelMemo">
      <div class="edit" id="fMemo" data-field="memo" contenteditable="true" data-ph="자유 메모…"></div>
    </div>
  </main>

  <!-- 서식 툴바 (각 탭 하부 공통) -->
  <div class="fmt-bar" id="fmtBar">
    <!-- 선택한 그림/표가 있을 때만 나오는 상황별 도구 -->
    <div class="node-bar hidden" id="nodeBar">
      <span class="node-label" id="nodeLabel"></span>
      <div class="node-acts" id="nodeActs"></div>
    </div>
    <div class="fmt-scope" id="fmtScope">
      <span class="fmt-label">적용:</span>
      <button data-scope="sel" class="on">선택</button>
      <button data-scope="all">전체</button>
      <span class="ins-group">
        <button id="btnInsImg" title="커서 위치에 그림 넣기">🖼️ 그림</button>
        <button id="btnInsTable" title="커서 위치에 표 넣기">▦ 표</button>
      </span>
    </div>
    <div class="fmt-row">
      <div class="fmt-group" title="글자">
        <button data-cmd="bold" aria-label="진하게"><b>진하게</b></button>
      </div>
      <div class="fmt-group" title="정렬">
        <button data-cmd="justifyLeft" aria-label="왼쪽 정렬">좌</button>
        <button data-cmd="justifyCenter" aria-label="가운데 정렬">중</button>
        <button data-cmd="justifyRight" aria-label="오른쪽 정렬">우</button>
      </div>
      <div class="fmt-group" title="글자 크기">
        <button data-size="2">작게</button>
        <button data-size="4">보통</button>
        <button data-size="6">크게</button>
        <button data-size="7">특대</button>
      </div>
      <div class="fmt-group colors" id="fmtColors" title="글자 색">
        <span class="grp-label">글자색</span>
        <button class="sw" data-color="#0f172a" style="background:#0f172a"></button>
        <button class="sw" data-color="#ef4444" style="background:#ef4444"></button>
        <button class="sw" data-color="#f97316" style="background:#f97316"></button>
        <button class="sw" data-color="#16a34a" style="background:#16a34a"></button>
        <button class="sw" data-color="#2563eb" style="background:#2563eb"></button>
        <button class="sw" data-color="#7c3aed" style="background:#7c3aed"></button>
        <label class="sw custom" title="직접 선택"><input type="color" id="fmtColorPick" value="#14b8a6" /></label>
      </div>
      <!-- 글자 음영(형광펜): 고른 글자의 배경색 -->
      <div class="fmt-group colors" id="fmtHilites" title="글자 음영">
        <span class="grp-label">음영</span>
        <button class="sw" data-hilite="#fef08a" style="background:#fef08a"></button>
        <button class="sw" data-hilite="#bbf7d0" style="background:#bbf7d0"></button>
        <button class="sw" data-hilite="#bfdbfe" style="background:#bfdbfe"></button>
        <button class="sw" data-hilite="#fbcfe8" style="background:#fbcfe8"></button>
        <button class="sw" data-hilite="#fed7aa" style="background:#fed7aa"></button>
        <button class="sw" data-hilite="#e2e8f0" style="background:#e2e8f0"></button>
        <label class="sw custom" title="직접 선택"><input type="color" id="fmtHilitePick" value="#fde68a" /></label>
        <button class="sw none" data-hilite="none" title="음영 지우기" aria-label="음영 지우기"></button>
      </div>
    </div>
  </div>
  <div class="save-hint" id="saveHint">자동 저장됨 ✓</div>

  <!-- 책갈피 — 해제 전까지 이 책을 열 때마다 표시해 둔 자리로 간다 -->
  <div class="mark-fab" id="markFab" hidden>
    <button class="mark-set" id="btnMarkSet" type="button">🔖 책갈피</button>
    <button class="mark-clear" id="btnMarkClear" type="button" aria-label="책갈피 해제" hidden>✕</button>
  </div>
  <div class="mark-toast" id="markToast" aria-live="polite"></div>
</section>

<!-- 책 추가/수정 모달 -->
<dialog id="bookDialog" class="dialog">
  <form method="dialog">
    <h2 id="dialogTitle">책 추가</h2>
    <label class="field"><span>제목</span>
      <input type="text" id="fBookTitle" autocomplete="off" placeholder="책 제목" required />
    </label>
    <label class="field"><span>저자</span>
      <input type="text" id="fBookAuthor" autocomplete="off" placeholder="지은이" />
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="dialogCancel">취소</button>
      <button type="button" class="btn" id="dialogSave">저장</button>
    </div>
  </form>
</dialog>

<!-- 표 삽입 모달 -->
<dialog id="tableDialog" class="dialog">
  <form method="dialog">
    <h2>표 넣기</h2>
    <div class="field-row">
      <label class="field"><span>행(가로줄)</span>
        <input type="number" id="fRows" min="1" max="30" value="3" inputmode="numeric" />
      </label>
      <label class="field"><span>열(세로줄)</span>
        <input type="number" id="fCols" min="1" max="10" value="3" inputmode="numeric" />
      </label>
    </div>
    <label class="check"><input type="checkbox" id="fHeader" checked /> <span>첫 줄을 제목 행으로</span></label>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="tableCancel">취소</button>
      <button type="button" class="btn" id="tableInsert">넣기</button>
    </div>
  </form>
</dialog>

<!-- 이미지 확대 -->
<div class="lightbox hidden" id="lightbox"><img id="lightboxImg" alt="" /></div>

<script src="assets/app.js?v=14"></script>
<script>
  // 새 버전이 올라와도 이미 떠 있는 페이지는 옛 코드를 계속 쓴다. 그래서
  //  ① 새 워커가 제어권을 잡으면 한 번 새로고침해 새 코드로 갈아탄다
  //  ② 앱이 화면으로 돌아올 때마다 새 버전이 있는지 확인한다
  //     (폰에서 앱을 백그라운드에 두면 새로 여는 일이 없어 영영 갱신되지 않는다)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return; reloaded = true; location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
